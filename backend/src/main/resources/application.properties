spring.application.name=school.sptech.api-gym

# ---------------------------------------------------------------
# Banco de dados: H2 em memoria
# Os dados vivem enquanto a aplicacao estiver rodando. A cada
# restart o schema.sql recria a tabela e recarrega os 3 alunos
# de exemplo.
# ---------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:db_gym
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Executa src/main/resources/schema.sql na subida da aplicacao
spring.sql.init.mode=always

# ---------------------------------------------------------------
# Console web do H2: http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:mem:db_gym | Usuario: sa | Senha: (vazia)
# ---------------------------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
